name: Build MiniAnimator Studio APK
on:
  workflow_dispatch:
  push:
    branches: [improve/animation-studio]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install editor test dependencies
        run: npm ci --no-audit --no-fund
      - name: Check editor logic
        run: |
          node --check app/src/main/assets/studio.js
          node tests/model.test.cjs
          node tests/pixels.test.cjs
          node tests/editor.integration.cjs
      - name: Build release
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiniAnimator-Studio-4.0-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
